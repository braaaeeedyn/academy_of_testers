<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon / tab icon -->
    <link rel="icon" type="image/png" href="/aotpfp.png" />
    <link rel="apple-touch-icon" href="/aotpfp.png" />

    <!-- Primary SEO -->
    <title>Academy of Testers — Free AP & SAT Prep, Practice & Past Exams</title>
    <meta
      name="description"
      content="Academy of Testers offers free AP and SAT prep: adaptive practice, past exam materials, unit overviews, flashcards, and AI-graded free-response practice. Study smarter and score higher."
    />
    <meta name="author" content="Academy of Testers" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://academyoftesters.com/" />
    <meta name="theme-color" content="#000000" />

    <!-- Open Graph (link previews on Google, iMessage, Slack, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Academy of Testers" />
    <meta property="og:title" content="Academy of Testers — Free AP & SAT Prep" />
    <meta
      property="og:description"
      content="Free AP and SAT prep: adaptive practice, past exams, unit overviews, flashcards, and AI-graded free-response practice."
    />
    <meta property="og:url" content="https://academyoftesters.com/" />
    <meta property="og:image" content="https://academyoftesters.com/aotpfp.png" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Academy of Testers — Free AP & SAT Prep" />
    <meta
      name="twitter:description"
      content="Free AP and SAT prep: adaptive practice, past exams, unit overviews, flashcards, and AI-graded free-response practice."
    />
    <meta name="twitter:image" content="https://academyoftesters.com/aotpfp.png" />

    <!-- Structured data: helps Google show the site name and details -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Academy of Testers",
        "url": "https://academyoftesters.com/",
        "description": "Free AP and SAT prep: adaptive practice, past exam materials, unit overviews, flashcards, and AI-graded free-response practice."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EducationalOrganization",
        "name": "Academy of Testers",
        "url": "https://academyoftesters.com/",
        "logo": "https://academyoftesters.com/aotpfp.png"
      }
    </script>

    <!-- Theme fonts (free substitutes for the six brand design systems) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=Figtree:wght@400;500;600;700&family=Sofia+Sans:wght@400;450;500;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Playfair+Display:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Geist+Mono:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <div id="root"></div>
