version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aot-postgres
    environment:
      POSTGRES_DB: aot_db
      POSTGRES_USER: aot_user
      POSTGRES_PASSWORD: aot_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aot_user -d aot_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: aot-api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aot_db
      SPRING_DATASOURCE_USERNAME: aot_user
      SPRING_DATASOURCE_PASSWORD: aot_password
      JWT_SECRET: ${JWT_SECRET:-default-dev-secret-that-is-at-least-32-bytes-long-for-hmac}
      MAIL_HOST: ${MAIL_HOST:-smtp-relay.brevo.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@academyoftesters.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Academy of Testers}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./server/src/main/resources/static:/app/static

volumes:
  postgres_data:
