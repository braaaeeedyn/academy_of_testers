name: Keep Render backend warm

# Render's free tier sleeps the service after ~15 min of inactivity, and the cold start takes
# 60-90s. Pinging the health endpoint every ~10 min keeps it awake so users don't hit that wait.
# Note: GitHub-hosted scheduled workflows can be delayed under load, so this reduces cold starts
# rather than eliminating them. For a hard guarantee, upgrade the Render service to a paid plan.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: |
          # Wait out a full cold start (up to ~4 min per attempt) and retry on any error, so a
          # slow spin-up doesn't fail the job. A timed-out request still reaches Render and wakes
          # the service, but retrying lets us confirm it actually came back up with a 200.
          curl -fsS \
            --retry 3 --retry-delay 20 --retry-all-errors --retry-connrefused \
            --max-time 240 \
            -o /dev/null -w "health -> HTTP %{http_code} in %{time_total}s\n" \
            https://academy-of-testers.onrender.com/api/health
