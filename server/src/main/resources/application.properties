# Application
spring.application.name=academy-of-testers
# Binds to the platform-assigned PORT in production (e.g. Render), 8080 locally.
server.port=${PORT:8080}

# Database
spring.datasource.url=jdbc:postgresql://postgres:5432/aot_db
spring.datasource.username=aot_user
spring.datasource.password=aot_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Static Resources
spring.web.resources.static-locations=classpath:/static/

# JWT
jwt.secret=${JWT_SECRET:default-dev-secret-that-is-at-least-32-bytes-long-for-hmac}
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000

# Mail (Brevo SMTP relay)
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# From address for outgoing mail (must be a verified sender/domain in Brevo)
app.mail.from=${MAIL_FROM:noreply@academyoftesters.com}
app.mail.from-name=${MAIL_FROM_NAME:Academy of Testers}

# OpenAI
openai.api-key=${OPENAI_API_KEY:}

# AI Usage
ai.usage.max-per-hour=10
